<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 450" width="800" height="450" style="width:100%;height:auto;display:block" role="img" aria-labelledby="ch012-atlas-04s0-t ch012-atlas-04s0-d" font-family="Pretendard, Noto Sans CJK KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch012-atlas-04s0-t">1. 비어 있는 상태에서 시작</title><desc id="ch012-atlas-04s0-d">두 실행 모두 parts는 빈 리스트이고 completed는 False입니다. 오른쪽 실행에서는 완료 이벤트만 뺍니다.</desc><rect x="0" y="0" width="800" height="450" rx="0" fill="#0c192a" stroke="none" /><g transform="translate(24,4) scale(.585)"><rect x="0" y="0" width="1280" height="102" fill="#14283D" stroke="none" stroke-width="1"/><text x="32" y="31.44" font-size="16" fill="#D9F578" xml:space="preserve" textLength="261.616" lengthAdjust="spacingAndGlyphs">CODE IN MOTION  /  STREAM-EVENTS</text><text x="32" y="74.24" font-size="36" fill="white" xml:space="preserve" textLength="504.972" lengthAdjust="spacingAndGlyphs">글자는 같아도 완료 상태가 다릅니다</text><text x="32" y="134.16" font-size="24" fill="#007C78" xml:space="preserve" textLength="318.816" lengthAdjust="spacingAndGlyphs">01 / 08   비어 있는 상태에서 시작</text><rect x="32" y="156" width="580" height="418" rx="16" fill="#14283D" stroke="none" stroke-width="1"/><text x="52" y="188.12" font-size="18" fill="#BBD0E4" xml:space="preserve" textLength="306.9" lengthAdjust="spacingAndGlyphs">핵심 발췌 · examples/04_stream_steps.py</text><rect x="43" y="207" width="557" height="30" rx="5" fill="#345C63" stroke="none" stroke-width="1"/><text x="52" y="224.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="10.54" lengthAdjust="spacingAndGlyphs"> 1</text><text x="85" y="227.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="84.898" lengthAdjust="spacingAndGlyphs">parts = []</text><rect x="43" y="236" width="557" height="30" rx="5" fill="#345C63" stroke="none" stroke-width="1"/><text x="52" y="253.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="13.532" lengthAdjust="spacingAndGlyphs"> 2</text><text x="85" y="256.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="167.926" lengthAdjust="spacingAndGlyphs">completed = False</text><text x="52" y="282.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="13.583" lengthAdjust="spacingAndGlyphs"> 3</text><text x="85" y="285.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="180.62" lengthAdjust="spacingAndGlyphs">for event in events:</text><text x="52" y="311.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="13.906" lengthAdjust="spacingAndGlyphs"> 4</text><text x="85" y="314.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="254.1" lengthAdjust="spacingAndGlyphs">  if event[&quot;type&quot;] == &quot;delta&quot;:</text><text x="52" y="340.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="12.954" lengthAdjust="spacingAndGlyphs"> 5</text><text x="85" y="343.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="276.804" lengthAdjust="spacingAndGlyphs">    parts.append(event[&quot;text&quot;])</text><text x="52" y="369.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="13.889" lengthAdjust="spacingAndGlyphs"> 6</text><text x="85" y="372.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="308.484" lengthAdjust="spacingAndGlyphs">    print(&quot;부분 표시:&quot;, &quot;&quot;.join(parts))</text><text x="52" y="398.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="12.801" lengthAdjust="spacingAndGlyphs"> 7</text><text x="85" y="401.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="322.014" lengthAdjust="spacingAndGlyphs">  elif event[&quot;type&quot;] == &quot;completed&quot;:</text><text x="52" y="427.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="14.246" lengthAdjust="spacingAndGlyphs"> 8</text><text x="85" y="430.48" font-size="22" fill="#EFF6FC" xml:space="preserve" 