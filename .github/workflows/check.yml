name: 교재 빌드와 링크 검사
on: [push, pull_request]
permissions:
  contents: read
jobs:
  textbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - run: python3 scripts/check.py
      - run: python3 scripts/check_pre_mid_notebooks.py
      - run: python3 scripts/check_pre_mid_release.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright==1.56.0' && python -m playwright install --with-deps chromium
      - run: python scripts/check_reader_layout.py
