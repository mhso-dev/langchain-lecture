name: 교재 빌드와 링크 검사
on: [push, pull_request]
permissions:
  contents: read
jobs:
  textbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - run: python3 scripts/check.py
      - run: python3 scripts/check_day_links.py
      - name: 모바일·데스크톱에서 일차 이동
        run: |
          python3 -m venv /tmp/course-browser
          /tmp/course-browser/bin/pip install --quiet playwright
          /tmp/course-browser/bin/python scripts/check_day_browser.py
  topic-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'langgraph>=1,<2' 'langchain-core>=1,<2' 'pydantic>=2,<3' 'httpx>=0.27,<1'
      - run: python scripts/check_topic_notebooks.py
