<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 450" width="800" height="450" style="width:100%;height:auto;display:block" role="img" aria-labelledby="ch012-atlas-03s0-t ch012-atlas-03s0-d" font-family="Pretendard, Noto Sans CJK KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch012-atlas-03s0-t">1. 중첩된 목록의 위치</title><desc id="ch012-atlas-03s0-d">바깥 목록은 output, 메시지 안의 목록은 content입니다. JSON 문자열은 text 안에 있습니다.</desc><rect x="0" y="0" width="800" height="450" rx="0" fill="#0c192a" stroke="none" /><g transform="translate(24,4) scale(.585)"><rect x="0" y="0" width="1280" height="102" fill="#14283D" stroke="none" stroke-width="1"/><text x="32" y="31.44" font-size="16" fill="#D9F578" xml:space="preserve" textLength="268.736" lengthAdjust="spacingAndGlyphs">CODE IN MOTION  /  RESPONSE-TRACE</text><text x="32" y="74.24" font-size="36" fill="white" xml:space="preserve" textLength="509.76" lengthAdjust="spacingAndGlyphs">중첩 응답에서 item과 part 따라가기</text><text x="32" y="134.16" font-size="24" fill="#007C78" xml:space="preserve" textLength="268.944" lengthAdjust="spacingAndGlyphs">01 / 07   중첩된 목록의 위치</text><rect x="32" y="156" width="580" height="418" rx="16" fill="#14283D" stroke="none" stroke-width="1"/><text x="52" y="188.12" font-size="18" fill="#BBD0E4" xml:space="preserve" textLength="317.052" lengthAdjust="spacingAndGlyphs">핵심 발췌 · examples/03_response_path.py</text><text x="52" y="224.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="10.54" lengthAdjust="spacingAndGlyphs"> 1</text><text x="85" y="227.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="283.646" lengthAdjust="spacingAndGlyphs">for item in response[&quot;output&quot;]:</text><text x="52" y="256.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="13.532" lengthAdjust="spacingAndGlyphs"> 2</text><text x="85" y="259.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="254.76" lengthAdjust="spacingAndGlyphs">  print(&quot;item:&quot;, item[&quot;type&quot;])</text><text x="52" y="288.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="13.583" lengthAdjust="spacingAndGlyphs"> 3</text><text x="85" y="291.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="270.688" lengthAdjust="spacingAndGlyphs">  if item[&quot;type&quot;] != &quot;message&quot;:</text><text x="52" y="320.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="13.906" lengthAdjust="spacingAndGlyphs"> 4</text><text x="85" y="323.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="316.646" lengthAdjust="spacingAndGlyphs">    print(&quot;메시지가 아니므로 건너뜀&quot;)</text><text x="52" y="352.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="12.954" lengthAdjust="spacingAndGlyphs"> 5</text><text x="85" y="355.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="103.73" lengthAdjust="spacingAndGlyphs">    continue</text><text x="52" y="384.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="13.889" lengthAdjust="spacingAndGlyphs"> 6</text><text x="85" y="387.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="258.676" lengthAdjust="spacingAndGlyphs">  for part in item[&quot;content&quot;]:</text><text x="52" y="416.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="12.801" lengthAdjust="spacingAndGlyphs"> 7</text><text x="85" y="419.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="258.984" lengthAdjust="spacingAndGlyphs">    print(&quot;part:&quot;, part[&quot;type&quot;])</text><text x="52" y="448.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="14.246" lengthAdjust="spacingAndGlyphs"> 8</text><text x="85" y="451.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="253.792" lengthAdjust="spacingAndGlyphs">    print(&quot;text:&quot;, part[&quot;text&quot;])</text><rect x="32" y="600" width="1216" height="90" rx="14" fill="#14283D" stroke="none" stroke-width="1"/><text x="54" y="638" font-size="25" fill="white" xml:space="preserve" textLength="902.725" lengthAdjust="spacingAndGlyphs">바깥 목록은 output, 메시지 안의 목록은 content입니다. JSON 문자열은 text 안에 있습니다.</text><rect x="32" y="701" width="1216" height="5" fill="#C8D4DF" stroke="none" stroke-width="1"/><rect x="640" y="156" width="608" height="418" rx="16" fill="white" stroke="#C8D4DF" stroke-width="1"/><text x="658" y="189" font-size="25" fill="#193048" xml:space="preserve" textLength="94.775" lengthAdjust="spacingAndGlyphs">response</text><text x="850" y="188.48" font-size="22" fill="#52687C" xml:space="preserve" textLength="176.77" lengthAdjust="spacingAndGlyphs">status = completed</text><text x="662" y="226.32" font-size="23" fill="#007C78" xml:space="preserve" textLength="85.238" lengthAdjust="spacingAndGlyphs">output  [</text><rect x="688" y="246" width="540" height="61" rx="16" fill="#EFF3F7" stroke="#C8D4DF" stroke-width="1"/><text x="706" y="282.32" font-size="23" fill="#193048" xml:space="preserve" textLength="348.726" lengthAdjust="spacingAndGlyphs">[0]  type: reasoning   content: None</text><rect x="688" y="329" width="540" height="227" rx="16" fill="#EFF9F7" stroke="#C8D4DF" stroke-width="1"/><text x="706" y="363.32" font-size="23" fill="#193048" xml:space="preserve" textLength="174.8" lengthAdjust="spacingAndGlyphs">[1]  type: message</text><text x="723" y="402.32" font-size="23" fill="#007C78" xml:space="preserve" textLength="94.829" lengthAdjust="spacingAndGlyphs">content  [</text><rect x="748" y="424" width="462" height="110" rx="16" fill="white" stroke="#C8D4DF" stroke-width="1"/><text x="763" y="457.32" font-size="23" fill="#193048" xml:space="preserve" textLength="209.622" lengthAdjust="spacingAndGlyphs">[0]  type: output_text</text><text x="764" y="494.32" font-size="23" fill="#2668C7" xml:space="preserve" textLength="175.283" lengthAdjust="spacingAndGlyphs">text:  JSON 문자열</text><text x="765" y="523.12" font-size="18" fill="#52687C" xml:space="preserve" textLength="163.458" lengthAdjust="spacingAndGlyphs">title = &quot;독서 모임&quot; 포함</text><rect x="32" y="701" width="173.714" height="5" fill="#007C78" stroke="none" stroke-width="1"/></g><rect x="0" y="423" width="800" height="27" rx="0" fill="#102737" stroke="none" /><g><text x="26" y="442" font-size="15" fill="#88f3dc" text-anchor="start" font-weight="550">01 / 07   중첩된 목록의 위치</text></g></svg>