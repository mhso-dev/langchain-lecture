<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 450" width="800" height="450" style="width:100%;height:auto;display:block" role="img" aria-labelledby="ch012-atlas-02s4-t ch012-atlas-02s4-d" font-family="Pretendard, Noto Sans CJK KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch012-atlas-02s4-t">5. 새 딕셔너리가 만들어졌습니다</title><desc id="ch012-atlas-02s4-d">세 필드를 읽은 결과를 data가 가리킵니다. raw는 str, data는 dict입니다.</desc><rect x="0" y="0" width="800" height="450" rx="0" fill="#0c192a" stroke="none" /><g transform="translate(24,4) scale(.585)"><rect x="0" y="0" width="1280" height="102" fill="#14283D" stroke="none" stroke-width="1"/><text x="32" y="31.44" font-size="16" fill="#D9F578" xml:space="preserve" textLength="240.848" lengthAdjust="spacingAndGlyphs">CODE IN MOTION  /  JSON-VALUES</text><text x="32" y="74.24" font-size="36" fill="white" xml:space="preserve" textLength="569.736" lengthAdjust="spacingAndGlyphs">json.loads 한 줄에서 실제로 달라지는 값</text><text x="32" y="134.16" font-size="24" fill="#007C78" xml:space="preserve" textLength="378.192" lengthAdjust="spacingAndGlyphs">05 / 08   새 딕셔너리가 만들어졌습니다</text><rect x="32" y="156" width="580" height="418" rx="16" fill="#14283D" stroke="none" stroke-width="1"/><text x="52" y="188.12" font-size="18" fill="#BBD0E4" xml:space="preserve" textLength="236.106" lengthAdjust="spacingAndGlyphs">핵심 발췌 · examples/01_json.py</text><text x="52" y="224.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="10.54" lengthAdjust="spacingAndGlyphs"> 1</text><text x="85" y="227.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="105.16" lengthAdjust="spacingAndGlyphs">import json</text><text x="52" y="256.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="13.532" lengthAdjust="spacingAndGlyphs"> 2</text><text x="85" y="259.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="64.064" lengthAdjust="spacingAndGlyphs">raw = (</text><text x="52" y="288.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="13.583" lengthAdjust="spacingAndGlyphs"> 3</text><text x="85" y="291.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="187.154" lengthAdjust="spacingAndGlyphs">  &#x27;{&quot;title&quot;:&quot;독서 모임&quot;,&#x27;</text><text x="52" y="320.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="13.906" lengthAdjust="spacingAndGlyphs"> 4</text><text x="85" y="323.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="300.872" lengthAdjust="spacingAndGlyphs">  &#x27;&quot;start&quot;:null,&quot;audience&quot;:&quot;adult&quot;}&#x27; </text><text x="52" y="352.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="12.954" lengthAdjust="spacingAndGlyphs"> 5</text><text x="85" y="355.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="6.974" lengthAdjust="spacingAndGlyphs">)</text><rect x="43" y="367" width="557" height="33" rx="5" fill="#345C63" stroke="none" stroke-width="1"/><text x="52" y="384.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="13.889" lengthAdjust="spacingAndGlyphs"> 6</text><text x="85" y="387.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="202.378" lengthAdjust="spacingAndGlyphs">data = json.loads(raw)</text><rect x="43" y="399" width="557" height="33" rx="5" fill="#345C63" stroke="none" stroke-width="1"/><text x="52" y="416.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="12.801" lengthAdjust="spacingAndGlyphs"> 7</text><text x="85" y="419.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="232.672" lengthAdjust="spacingAndGlyphs">print(type(raw).__name__)</text><rect x="43" y="431" width="557" height="33" rx="5" fill="#345C63" stroke="none" stroke-width="1"/><text x="52" y="448.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="14.246" lengthAdjust="spacingAndGlyphs"> 8</text><text x="85" y="451.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="239.118" lengthAdjust="spacingAndGlyphs">print(type(data).__name__)</text><text x="52" y="480.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="13.889" lengthAdjust="spacingAndGlyphs"> 9</text><text x="85" y="483.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="164.45" lengthAdjust="spacingAndGlyphs">print(data[&quot;title&quot;])</text><text x="52" y="512.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="16.779" lengthAdjust="spacingAndGlyphs">10</text><text x="85" y="515.48" font-size="22" fill="#EFF6FC" xml:space="preserve" textLength="245.476" lengthAdjust="spacingAndGlyphs">print(data[&quot;start&quot;] is None)</text><rect x="32" y="600" width="1216" height="90" rx="14" fill="#14283D" stroke="none" stroke-width="1"/><text x="54" y="638" font-size="25" fill="white" xml:space="preserve" textLength="706.3" lengthAdjust="spacingAndGlyphs">세 필드를 읽은 결과를 data가 가리킵니다. raw는 str, data는 dict입니다.</text><rect x="32" y="701" width="1216" height="5" fill="#C8D4DF" stroke="none" stroke-width="1"/><rect x="640" y="156" width="608" height="156" rx="16" fill="white" stroke="#C8D4DF" stroke-width="1"/><text x="660" y="189.32" font-size="23" fill="#2668C7" xml:space="preserve" textLength="35.558" lengthAdjust="spacingAndGlyphs">raw</text><rect x="1147" y="166" width="51.109" height="42" rx="10" fill="#2668C7" stroke="none" stroke-width="1"/><text x="1162" y="188.96" font-size="19" fill="white" xml:space="preserve" textLength="21.109" lengthAdjust="spacingAndGlyphs">str</text><text x="662" y="237.84" font-size="26" fill="#193048" xml:space="preserve" textLength="210.626" lengthAdjust="spacingAndGlyphs">{ &quot;title&quot;: &quot;독서 모임&quot;,</text><text x="662" y="274.84" font-size="26" fill="#193048" xml:space="preserve" textLength="365.534" lengthAdjust="spacingAndGlyphs">  &quot;start&quot;: null, &quot;audience&quot;: &quot;adult&quot; }</text><path d="M932 318L932 359" fill="none" s