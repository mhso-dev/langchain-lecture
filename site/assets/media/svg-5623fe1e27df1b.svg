<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 450" width="800" height="450" style="width:100%;height:auto;display:block" role="img" aria-labelledby="ch012-atlas-01s8-t ch012-atlas-01s8-d" font-family="Pretendard, Noto Sans CJK KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title id="ch012-atlas-01s8-t">9. 입력을 비워 다시 요청하면?</title><desc id="ch012-atlas-01s8-d">입력을 비우고 다시 요청한 별도 실행입니다. 서버가 400을 보내면 전체 예제의 catch와 finally가 오류 안내와 버튼 상태를 처리합니다.</desc><rect x="0" y="0" width="800" height="450" rx="0" fill="#0c192a" stroke="none" /><g transform="translate(24,4) scale(.585)"><rect x="0" y="0" width="1280" height="102" fill="#14283D" stroke="none" stroke-width="1"/><text x="32" y="31.44" font-size="16" fill="#D9F578" xml:space="preserve" textLength="254.992" lengthAdjust="spacingAndGlyphs">CODE IN MOTION  /  HTML-REQUEST</text><text x="32" y="74.24" font-size="36" fill="white" xml:space="preserve" textLength="402.084" lengthAdjust="spacingAndGlyphs">버튼 클릭부터 결과 표시까지</text><text x="32" y="134.16" font-size="24" fill="#007C78" xml:space="preserve" textLength="354.624" lengthAdjust="spacingAndGlyphs">09 / 09   입력을 비워 다시 요청하면?</text><rect x="32" y="156" width="580" height="418" rx="16" fill="#14283D" stroke="none" stroke-width="1"/><text x="52" y="188.12" font-size="18" fill="#BBD0E4" xml:space="preserve" textLength="346.536" lengthAdjust="spacingAndGlyphs">핵심 발췌 · examples/browser-flow/index.html</text><text x="52" y="224.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="10.54" lengthAdjust="spacingAndGlyphs"> 1</text><text x="85" y="226.64" font-size="21" fill="#EFF6FC" xml:space="preserve" textLength="398.601" lengthAdjust="spacingAndGlyphs">button.addEventListener(&quot;click&quot;, async () =&gt; {</text><text x="52" y="256.28" font-size="17" fill="#9FB9CE" xml:space="preserve" textLength="13.532" lengthAdjust="spacingAndGlyphs"> 2</text><text x="85" y="258.64" font-size="21" fill="#EFF6FC" xml:space=